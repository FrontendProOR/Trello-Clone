<div class="modal-header">
  <h5 class="modal-title" id="loginModalLabel">Login</h5>
  <button type="button" class="btn-close" (click)="closeLoginModal()"></button>
</div>
<div class="modal-body">
  <form (ngSubmit)="onLoginSubmit()">
    <div class="mb-3">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" [(ngModel)]="loginData.email" name="email" class="form-control" required />
    </div>
    <div class="mb-3">
      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" [(ngModel)]="loginData.password" name="password" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-primary w-100">Login</button>
    <div>
      <!-- <p class="mt-3 text-center">
        Don't have an account?
        <a href="#" (click)="openRegisterModal()">Register here</a>
      </p> -->
      <!--Forgot Password-->
      <p class="mt-1 text-center">
        <a href="#" (click)="openForgotPasswordModal()">Forgot Password?</a>
    </div>
  </form>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-secondary" (click)="closeLoginModal()">Close</button>
</div>
