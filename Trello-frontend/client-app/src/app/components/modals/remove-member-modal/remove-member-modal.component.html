<div class="modal-header">
    <h5 class="modal-title">Remove Member from Project</h5>
    <button type="button" class="btn-close" (click)="activeModal.close()" aria-label="Close"></button>
  </div>
  <div class="modal-body">
    <h5>Current Members:</h5>
    <table class="table">
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Username</th>
          <th>Email</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let member of members">
          <td>{{ member.first_name }}</td>
          <td>{{ member.last_name }}</td>
          <td>{{ member.username }}</td>
          <td>{{ member.email }}</td>
          <td>
            <button class="btn btn-danger btn-sm" (click)="removeMember(member.id)">
              Delete
            </button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
