<div class="modal-header">
    <h5 class="modal-title">Edit User</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="close()"></button>
  </div>
  
  <div class="modal-body">
    <form [formGroup]="editUserForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label for="first_name">First Name</label>
        <input 
          id="first_name" 
          formControlName="first_name" 
          type="text" 
          class="form-control" 
          placeholder="Enter your first name">
        <div *ngIf="editUserForm.controls['first_name'].invalid && editUserForm.controls['first_name'].touched" class="error">
          First name is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="last_name">Last Name</label>
        <input 
          id="last_name" 
          formControlName="last_name" 
          type="text" 
          class="form-control" 
          placeholder="Enter your last name">
        <div *ngIf="editUserForm.controls['last_name'].invalid && editUserForm.controls['last_name'].touched" class="error">
          Last name is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="username">Username</label>
        <input 
          id="username" 
          formControlName="username" 
          type="text" 
          class="form-control" 
          placeholder="Choose a username">
        <div *ngIf="editUserForm.controls['username'].invalid && editUserForm.controls['username'].touched" class="error">
          Username is required and must be at least 3 characters.
        </div>
      </div>
  
      <div class="form-group">
        <label for="email">Email</label>
        <input 
          id="email" 
          formControlName="email" 
          type="email" 
          class="form-control" 
          placeholder="Enter your email">
        <div *ngIf="editUserForm.controls['email'].invalid && editUserForm.controls['email'].touched" class="error">
          Please enter a valid email.
        </div>
      </div>
      <!--disable the role field if necessary-->
      <div class="form-group" >
        <label for="role">Role</label>
        <select 
          id="role" 
          formControlName="role" 
          class="form-control">
          <option value="">Select a role</option>
          <option value="member">Member</option>
          <option value="manager">Manager</option>
        </select>
        <div *ngIf="editUserForm.controls['role'].invalid && editUserForm.controls['role'].touched" class="error">
          Role is required.
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="editUserForm.invalid">Update</button>
    </form>
  </div>
  
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="close()">Close</button>
  </div>
