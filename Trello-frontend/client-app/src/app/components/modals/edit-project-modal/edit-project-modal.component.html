<div class="modal-header">
    <h5 class="modal-title">Edit Project</h5>
    <button type="button" class="btn-close" aria-label="Close" (click)="closeEditProjectModal()"></button>
  </div>
  <div class="modal-body">
    <form [formGroup]="projectForm" (ngSubmit)="editProject()">
      
      <div class="form-group">
        <label for="name">Project Name</label>
        <input 
          id="name" 
          formControlName="name" 
          type="text" 
          class="form-control" 
          placeholder="Enter project name">
        <div *ngIf="projectForm.controls['name'].invalid && projectForm.controls['name'].touched" class="error">
          Project name is required. {{projectForm.controls['name']}}
        </div>
      </div>
  
      <div class="form-group">
        <label for="description">Project Description</label>
        <textarea 
          id="description" 
          formControlName="description" 
          class="form-control" 
          placeholder="Enter project description"></textarea>
        <div *ngIf="projectForm.controls['description'].invalid && projectForm.controls['description'].touched" class="error">
          Description is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="expectedEndDate">Expected End Date</label>
        <input 
          id="expectedEndDate" 
          formControlName="expectedEndDate" 
          type="date" 
          class="form-control">
        <div *ngIf="projectForm.controls['expectedEndDate'].invalid && projectForm.controls['expectedEndDate'].touched" class="error">
          Expected end date is required.
        </div>
      </div>
  
      <div class="form-group">
        <label for="minMembers">Minimum Members</label>
        <input 
          id="minMembers" 
          formControlName="minMembers" 
          type="number" 
          class="form-control" 
          placeholder="Minimum number of members"
          [min]="1">
        <div *ngIf="projectForm.controls['minMembers'].invalid && projectForm.controls['minMembers'].touched" class="error">
          Minimum members is required and must be at least 1.
        </div>
      </div>
  
      <div class="form-group">
        <label for="maxMembers">Maximum Members</label>
        <input 
          id="maxMembers" 
          formControlName="maxMembers" 
          type="number" 
          class="form-control" 
          placeholder="Maximum number of members"
          [min]="1">
        <div *ngIf="projectForm.controls['maxMembers'].invalid && projectForm.controls['maxMembers'].touched" class="error">
          Maximum members is required and must be at least 1.
        </div>
      </div>
  
      <div class="form-group">
        <label for="status">Status</label>
        <select 
          id="status" 
          formControlName="status" 
          class="form-control">
          <option value="planning">Planning</option>
          <option value="active">Active</option>
          <option value="finished">Finished</option>
        </select>
        <div *ngIf="projectForm.controls['status'].invalid && projectForm.controls['status'].touched" class="error">
          Status is required.
        </div>
      </div>
  
      <button type="submit" class="btn btn-primary" [disabled]="projectForm.invalid">Update Project</button>
    </form>
  </div>
  
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="closeEditProjectModal()">Close</button>
  </div>
